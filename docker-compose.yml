version: "3.9"

services:
  docling-api:
    build: .
    ports:
      - "8000:8000"
    networks:
      - app_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  app_network:
    external: true