version: "3.9"

services:
  docling-api:
    build: .
    ports:
      - "8000:8000"
    networks:
      - app_network
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-keep-alive", "3600", "--ws-ping-timeout", "3600"]

networks:
  app_network:
    external: true
